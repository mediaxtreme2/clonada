name: Build Clonada Plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config zeromq

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install zeromq:x64-windows-static-md

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        working-directory: plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        working-directory: plugin
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        working-directory: plugin
        run: cmake --build build --config Release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: plugin
        run: |
          mkdir -p dist
          cp -r build/Clonada_artefacts/Release/VST3/Clonada.vst3 dist/ 2>/dev/null || true
          cp -r build/Clonada_artefacts/Release/AU/Clonada.component dist/ 2>/dev/null || true
          cp -r build/Clonada_artefacts/Release/CLAP/Clonada.clap dist/ 2>/dev/null || true
          cp -r build/Clonada_artefacts/Release/Standalone/Clonada.app dist/ 2>/dev/null || true
          cd dist && zip -r ../../Clonada-beta-macOS.zip . && cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: plugin
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/Clonada_artefacts/Release/VST3/Clonada.vst3 dist/ 2>/dev/null || true
          cp -r build/Clonada_artefacts/Release/CLAP/Clonada.clap dist/ 2>/dev/null || true
          cp -r build/Clonada_artefacts/Release/Standalone/Clonada.exe dist/ 2>/dev/null || true
          cd dist && 7z a ../../Clonada-beta-Windows.zip . && cd ..

      - name: Upload to beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ matrix.platform }}
          name: "Clonada Beta - ${{ matrix.platform }}"
          body: |
            Auto-built beta binaries for ${{ matrix.platform }}.
            Commit: ${{ github.sha }}
            Built: ${{ github.event.head_commit.message }}
          files: Clonada-beta-*.zip
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
