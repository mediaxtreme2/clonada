name: Sync RunPod Worker Image

on:
  push:
    branches: [main]
    paths:
      - 'runpod/**'
      - 'python/lib/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  sync-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to worker repo
        env:
          GH_TOKEN: ${{ secrets.WORKER_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/anirudhatalmale6-alt/clonada-worker.git worker
          cd worker
          rm -rf python/lib handler.py Dockerfile requirements.txt
          mkdir -p python/lib
          cp -r ../python/lib/* python/lib/
          cp ../runpod/handler.py .
          cp ../runpod/Dockerfile .
          cp ../runpod/requirements.txt .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync from main repo"
            git push
          fi
