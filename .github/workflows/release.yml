name: Release Clonada

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config zeromq

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zeromq:x64-windows-static-md

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        working-directory: plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        working-directory: plugin
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        working-directory: plugin
        run: cmake --build build --config Release --parallel

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Clonada/python/lib

          # Copy plugin binaries
          cp -r plugin/build/Clonada_artefacts/Release/VST3/Clonada.vst3 dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/AU/Clonada.component dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/CLAP/Clonada.clap dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/Standalone/Clonada.app dist/Clonada/ 2>/dev/null || true

          # Copy Python engine
          cp python/*.py dist/Clonada/python/
          cp python/requirements.txt dist/Clonada/python/
          cp python/lib/*.py dist/Clonada/python/lib/

          # Copy installer assets
          cp installer/license.txt dist/Clonada/
          cp installer/install_macos.sh dist/Clonada/
          chmod +x dist/Clonada/install_macos.sh

          cat > dist/Clonada/README.txt << 'EOF'
          CLONADA AI VOCAL SUITE v${{ github.event.inputs.version }}

          1. Double-click "Install Clonada.command" to install plugin files
          2. Run install_macos.sh to set up the Python AI engine
          3. Open your DAW and rescan plugins
          4. Activate with your license key on first launch

          Models download automatically on first use (~200MB).
          EOF

          cat > "dist/Clonada/Install Clonada.command" << 'INSTALLEOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Installing Clonada plugins..."
          mkdir -p "$HOME/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/CLAP"
          [ -d "$SCRIPT_DIR/Clonada.vst3" ] && cp -R "$SCRIPT_DIR/Clonada.vst3" "$HOME/Library/Audio/Plug-Ins/VST3/"
          [ -d "$SCRIPT_DIR/Clonada.component" ] && cp -R "$SCRIPT_DIR/Clonada.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          [ -f "$SCRIPT_DIR/Clonada.clap" ] && cp "$SCRIPT_DIR/Clonada.clap" "$HOME/Library/Audio/Plug-Ins/CLAP/"
          [ -d "$SCRIPT_DIR/Clonada.app" ] && cp -R "$SCRIPT_DIR/Clonada.app" /Applications/

          # Copy Python engine to install directory
          INSTALL_DIR="$HOME/Clonada"
          mkdir -p "$INSTALL_DIR"
          cp -R "$SCRIPT_DIR/python" "$INSTALL_DIR/"

          echo ""
          echo "Plugins installed! Rescan in your DAW."
          echo "Now run: bash $INSTALL_DIR/install_macos.sh"
          echo "to set up the AI engine."
          INSTALLEOF
          chmod +x "dist/Clonada/Install Clonada.command"

          hdiutil create -volname "Clonada" -srcfolder dist/Clonada -ov -format UDZO \
            "Clonada-${{ github.event.inputs.version }}-macOS.dmg"

      - name: Create Windows installer package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/Clonada
          cp -r plugin/build/Clonada_artefacts/Release/VST3/Clonada.vst3 dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/CLAP/Clonada.clap dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/Standalone/Clonada.exe dist/Clonada/ 2>/dev/null || true
          cp installer/install_windows.bat dist/Clonada/
          cp installer/license.txt dist/Clonada/

      - name: Build Windows Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ github.event.inputs.version }}" installer\clonada.iss
          Move-Item installer\Output\*.exe "Clonada-${{ github.event.inputs.version }}-Windows-Setup.exe"

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: clonada-macos-dmg
          path: "Clonada-${{ github.event.inputs.version }}-macOS.dmg"
          retention-days: 30

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: clonada-windows-installer
          path: "Clonada-${{ github.event.inputs.version }}-Windows-Setup.exe"
          retention-days: 30

      - name: Upload Windows ZIP (fallback)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: clonada-windows-zip
          path: dist/Clonada/
          retention-days: 30

  create-release:
    needs: build-plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: clonada-macos-dmg
          path: release/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: clonada-windows-installer
          path: release/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: clonada-windows-zip
          path: release/windows-zip/

      - name: Package Windows ZIP
        run: |
          cd release/windows-zip && zip -r "../Clonada-${{ github.event.inputs.version }}-Windows.zip" . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Clonada v${{ github.event.inputs.version }}
          body: |
            ## Clonada AI Vocal Suite v${{ github.event.inputs.version }}

            ### Downloads
            | Platform | Installer | Manual |
            |----------|-----------|--------|
            | Windows  | `.exe` Setup (recommended) | `.zip` archive |
            | macOS    | `.dmg` Disk Image | - |

            ### Plugin Formats
            - **VST3** — Windows, macOS (Ableton, FL Studio, Cubase, Pro Tools, etc.)
            - **Audio Unit** — macOS only (Logic Pro, GarageBand)
            - **CLAP** — Windows, macOS (Bitwig, REAPER)
            - **Standalone** — Windows, macOS

            ### Installation
            **Windows:** Run the `.exe` installer. It copies VST3/CLAP to standard plugin folders and includes the AI engine setup.
            **macOS:** Open the `.dmg` and double-click "Install Clonada.command", then run `install_macos.sh` to set up the AI engine.

            After installing, activate with your license key on first plugin launch. AI models (~200MB) download automatically on first use.

            ### License Keys
            Each license supports up to 5 device activations. Keys are platform-independent — one key works on both Windows and macOS.

            ### Requirements
            - Windows 10+ (64-bit) or macOS 12+ (Apple Silicon native)
            - 8 GB RAM minimum
            - Internet connection for license activation, model download, and cloud training
          files: |
            release/Clonada-${{ github.event.inputs.version }}-macOS.dmg
            release/Clonada-${{ github.event.inputs.version }}-Windows-Setup.exe
            release/Clonada-${{ github.event.inputs.version }}-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
