name: Release Clonada

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: true
        default: '1.2.0'

permissions:
  contents: write

jobs:
  build-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config zeromq

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zeromq:x64-windows-static-md

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        working-directory: plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        working-directory: plugin
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        working-directory: plugin
        run: cmake --build build --config Release --parallel

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASS="temp_keychain_$(date +%s)"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "SIGNING_IDENTITY=Developer ID Application: mediaXtreme LLC (DBJC3A73UV)" >> $GITHUB_ENV

      - name: Create macOS DMG with unified installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Clonada/python/lib

          # Copy plugin binaries
          cp -r plugin/build/Clonada_artefacts/Release/VST3/Clonada.vst3 dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/AU/Clonada.component dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/CLAP/Clonada.clap dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/Standalone/Clonada.app dist/Clonada/ 2>/dev/null || true

          # Copy Python engine
          cp python/*.py dist/Clonada/python/
          cp python/requirements.txt dist/Clonada/python/
          cp python/lib/*.py dist/Clonada/python/lib/

          # Copy unified installer (this IS the single-step installer)
          cp installer/install_macos.sh dist/Clonada/
          chmod +x dist/Clonada/install_macos.sh

          # Copy license
          cp installer/license.txt dist/Clonada/

          # Create the .command wrapper that users double-click in Finder
          cat > "dist/Clonada/Install Clonada.command" << 'CMDEOF'
          #!/bin/bash
          # Wrapper so users can double-click in Finder
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"
          bash "$SCRIPT_DIR/install_macos.sh"
          echo ""
          echo "You can close this window now."
          read -n 1 -s -r -p "Press any key to exit..."
          CMDEOF
          chmod +x "dist/Clonada/Install Clonada.command"

          cat > dist/Clonada/README.txt << EOF
          CLONADA AI VOCAL SUITE v${{ github.event.inputs.version }}
          ============================================

          ONE-STEP INSTALL:
            Double-click "Install Clonada.command"

          That's it! The installer will:
            1. Copy plugins (VST3, AU, CLAP) to your DAW folders
            2. Install the standalone app to Applications
            3. Set up the Python AI engine automatically
            4. Create all necessary directories

          After installation:
            1. Open your DAW and rescan plugins
            2. Load Clonada on a vocal track
            3. Enter your license key
            4. AI models download automatically on first use (~200 MB)

          To uninstall: bash ~/Clonada/uninstall.sh

          Requirements:
            - macOS 12+ (Apple Silicon native support)
            - 8 GB RAM minimum
            - Internet connection for setup and model downloads
          EOF

          # Code sign all binaries
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing with: $SIGNING_IDENTITY"
            for target in \
              "dist/Clonada/Clonada.vst3" \
              "dist/Clonada/Clonada.component" \
              "dist/Clonada/Clonada.clap" \
              "dist/Clonada/Clonada.app"; do
              if [ -e "$target" ]; then
                codesign --force --deep --sign "$SIGNING_IDENTITY" \
                  --options runtime --timestamp "$target"
                echo "Signed: $target"
              fi
            done
          fi

          hdiutil create -volname "Clonada" -srcfolder dist/Clonada -ov -format UDZO \
            "Clonada-${{ github.event.inputs.version }}-macOS.dmg"

          # Sign the DMG itself
          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp \
              "Clonada-${{ github.event.inputs.version }}-macOS.dmg"
            echo "Signed DMG"
          fi

      - name: Create Windows installer package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/Clonada
          cp -r plugin/build/Clonada_artefacts/Release/VST3/Clonada.vst3 dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/CLAP/Clonada.clap dist/Clonada/ 2>/dev/null || true
          cp -r plugin/build/Clonada_artefacts/Release/Standalone/Clonada.exe dist/Clonada/ 2>/dev/null || true
          cp installer/install_windows.bat dist/Clonada/
          cp installer/license.txt dist/Clonada/

      - name: Build Windows Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ github.event.inputs.version }}" installer\clonada.iss
          Move-Item installer\Output\*.exe "Clonada-${{ github.event.inputs.version }}-Windows-Setup.exe"

      - name: Cleanup keychain
        if: runner.os == 'macOS' && always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: clonada-macos-dmg
          path: "Clonada-${{ github.event.inputs.version }}-macOS.dmg"
          retention-days: 30

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: clonada-windows-installer
          path: "Clonada-${{ github.event.inputs.version }}-Windows-Setup.exe"
          retention-days: 30

      - name: Upload Windows ZIP (fallback)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: clonada-windows-zip
          path: dist/Clonada/
          retention-days: 30

  create-release:
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: clonada-macos-dmg
          path: release/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: clonada-windows-installer
          path: release/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: clonada-windows-zip
          path: release/windows-zip/

      - name: Package Windows ZIP
        run: |
          cd release/windows-zip && zip -r "../Clonada-${{ github.event.inputs.version }}-Windows.zip" . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Clonada v${{ github.event.inputs.version }}
          body: |
            ## Clonada AI Vocal Suite v${{ github.event.inputs.version }}

            ### What's New
            - **Single-step installer** — macOS users now just double-click "Install Clonada.command" and everything sets up automatically (plugins + AI engine)
            - Apple code-signed binaries (no Gatekeeper warnings)

            ### Downloads
            | Platform | Installer | Manual |
            |----------|-----------|--------|
            | Windows  | `.exe` Setup (recommended) | `.zip` archive |
            | macOS    | `.dmg` Disk Image | - |

            ### Plugin Formats
            - **VST3** — Windows, macOS (Ableton, FL Studio, Cubase, Pro Tools, etc.)
            - **Audio Unit** — macOS only (Logic Pro, GarageBand)
            - **CLAP** — Windows, macOS (Bitwig, REAPER)
            - **Standalone** — Windows, macOS

            ### Installation
            **macOS:** Open the `.dmg`, double-click "Install Clonada.command" — that's it! Plugins, standalone app, and AI engine all set up in one step. Takes 5-15 minutes for the AI engine download.

            **Windows:** Run the `.exe` installer. Select "Full installation" to include the AI engine, or "Plugin only" for just the VST3/CLAP files.

            After installing, activate with your license key on first plugin launch. AI models (~200MB) download automatically on first use.

            ### License Keys
            Each license supports up to 5 device activations. Keys are platform-independent — one key works on both Windows and macOS.

            ### Requirements
            - Windows 10+ (64-bit) or macOS 12+ (Apple Silicon native)
            - 8 GB RAM minimum
            - Internet connection for license activation, model download, and cloud training
          files: |
            release/Clonada-${{ github.event.inputs.version }}-macOS.dmg
            release/Clonada-${{ github.event.inputs.version }}-Windows-Setup.exe
            release/Clonada-${{ github.event.inputs.version }}-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
